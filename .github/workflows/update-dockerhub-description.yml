name: Update Docker Hub Description

on:
  push:
    branches:
      - main
    paths:
      - README.md
      - .github/workflows/update-dockerhub-description.yml
  workflow_dispatch:

jobs:
  update-description:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        # Pin to SHA for supply-chain security. v5.1.0 uses Node 24
        # (GitHub is deprecating Node 20 in actions/checkout v4.x).
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Check README fits Docker Hub long description
        run: |
          chars=$(wc -m < README.md)
          echo "README.md: $chars characters (Hub full_description limit 25000)"
          if [ "$chars" -gt 25000 ]; then
            echo "Error: Docker Hub rejects full_description over ~25000 characters (HTTP 400)." >&2
            echo "Summarize README.md without dropping facts. See AGENTS.md." >&2
            exit 1
          fi

      - name: Authenticate against Docker Hub API
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
        run: |
          TOKEN=$(curl -fsSL -X POST "https://hub.docker.com/v2/users/login/" \
            -H "Content-Type: application/json" \
            -d "{\"username\": \"${DOCKERHUB_USERNAME}\", \"password\": \"${DOCKERHUB_PASSWORD}\"}" | jq -r '.token')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "Error: could not obtain Docker Hub JWT token" >&2
            exit 1
          fi
          echo "DOCKERHUB_JWT=$TOKEN" >> "$GITHUB_ENV"

      - name: Update Docker Hub long description from README.md
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_REPO: ${{ vars.DOCKERHUB_REPO }}
        run: |
          # Construir el JSON en un archivo temporal para evitar problemas
          # de escape con caracteres especiales del README (backticks,
          # backslashes, acentos, comillas dobles, etc.). El viejo
          # 'jq -Rs . < README.md' embebido en -d funcionaba pero era
          # fragil ante cambios en jq o en el contenido del README.
          jq -n --rawfile description README.md '{full_description: $description}' \
            > /tmp/dockerhub-desc-payload.json

          # Validar que el payload es JSON valido antes de enviarlo.
          jq . /tmp/dockerhub-desc-payload.json > /dev/null

          response=$(curl -sS -X PATCH "https://hub.docker.com/v2/repositories/${DOCKERHUB_USERNAME}/${DOCKERHUB_REPO}/" \
            -H "Authorization: JWT ${DOCKERHUB_JWT}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/dockerhub-desc-payload.json \
            -w "\n%{http_code}")
          status_code=$(echo "$response" | tail -n 1)
          body=$(echo "$response" | sed '$d')
          echo "$body"
          if [ "$status_code" -ne 200 ]; then
            echo "Error: Docker Hub description update failed with HTTP status $status_code" >&2
            exit 1
          fi
