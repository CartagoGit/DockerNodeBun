name: Build and Push Docker Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to build and push (e.g. v6_n22.21.1_b1.3.14)'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    # NOTA: IMAGE_TAG NO se declara aqui en el env: del job. La razón
    # es que este workflow se dispara de dos formas:
    #   1. push de tag v* -> GITHUB_REF = refs/tags/<tag>
    #   2. workflow_dispatch manual -> GITHUB_REF = refs/heads/main
    # En el caso 2, el valor del env: del job seria literalmente
    # 'cartagodocker/nodebun:refs/heads/main', un tag invalido.
    # Por eso IMAGE_TAG se computa en el step 'Resolve tag name' y
    # se exporta a GITHUB_ENV alli.

    steps:
      - name: Checkout repository
        # Pin to SHA for supply-chain security. Update SHA when bumping
        # the action. v4.2.2 corresponds to the SHA below.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        # v4.3.0
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Log in to Docker Hub
        # v4.6.0
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Resolve tag name
        run: |
          # Soporta dos disparadores:
          #   1. push de tag v*: GITHUB_REF = 'refs/tags/<tag>'
          #   2. workflow_dispatch: tag viene del input 'tag_name'
          set -euo pipefail
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION_TAG="${GITHUB_REF#refs/tags/}"
          else
            # workflow_dispatch: el input se valida que exista
            VERSION_TAG="${{ inputs.tag_name }}"
            if [[ -z "$VERSION_TAG" ]]; then
              echo "Error: tag_name input is required for workflow_dispatch" >&2
              exit 1
            fi
          fi
          echo "VERSION_TAG=$VERSION_TAG" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPO }}:$VERSION_TAG" >> "$GITHUB_ENV"
          echo "Resolved IMAGE_TAG=$IMAGE_TAG"

      - name: Check if the tag already exists on Docker Hub
        id: check
        run: |
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" "https://hub.docker.com/v2/repositories/${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPO }}/tags/${{ env.VERSION_TAG }}/")
          echo "Tag check HTTP: $HTTP"
          if [ "$HTTP" -eq 200 ]; then
            echo "Tag ${{ env.VERSION_TAG }} already exists on Docker Hub"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tag ${{ env.VERSION_TAG }} is new"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Docker image
        if: steps.check.outputs.exists != 'true'
        run: |
          # Parsear el tag para extraer X.Y.Z (el primer segmento
          # antes del primer '_'). Formato esperado (esquema 3):
          #   v1.0.0_n22.21.1_b1.3.14
          #   v1.0.0_n26.3.1_b1.3.14
          # VERSION es el contador semver ligero de correcciones
          # del repo. Se inyecta como --build-arg para que el
          # Dockerfile lo vea y lo exponga como ENV VERSION.
          #
          # Si el tag no matchea, fallamos loud (antes el workflow
          # hubiera pusheado una imagen sin VERSION inyectada).
          if [[ ! "${{ env.VERSION_TAG }}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)_ ]]; then
            echo "Error: tag '${{ env.VERSION_TAG }}' does not match scheme v{X.Y.Z}_n..._b..." >&2
            echo "       See VERSIONING.md for the policy. Legacy tags (v{N}_n..._b... or v.MAJOR.MINOR.PATCH) are not accepted." >&2
            exit 1
          fi
          VERSION="${BASH_REMATCH[1]}"
          echo "Extracted VERSION=$VERSION from tag ${{ env.VERSION_TAG }}"
          docker build \
            --build-arg VERSION="$VERSION" \
            -t "${{ env.IMAGE_TAG }}" .

      - name: Push Docker image
        if: steps.check.outputs.exists != 'true'
        run: |
          docker push "${{ env.IMAGE_TAG }}"

      # El tag 'latest' no se publica desde este repo. VERSIONING.md explica
      # el rationale (reproducibilidad, cada consumidor fija su tag exacto).
